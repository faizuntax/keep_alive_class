name: Supabase Health Check
on:
  schedule:
    # Jalan setiap 6 jam
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: RPC Health Check
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/health_check" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          
          http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          body=$(echo "$response" | sed '$d')
          
          echo "RPC Response: $body"
          echo "Status: $http_status"
          
          if [ "$http_status" -ge 400 ]; then
            echo "::error::RPC health check failed with status $http_status"
            exit 1
          fi

      - name: Ping Table
        if: always()
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/YOUR_TABLE_NAME?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          body=$(echo "$response" | sed '$d')
          
          echo "Table Ping Response: $body"
          echo "Status: $http_status"
          
          if [ "$http_status" -ge 400 ]; then
            echo "::error::Table ping failed with status $http_status"
            exit 1
          fi
